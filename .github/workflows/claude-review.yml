# .github/workflows/claude-review.yml
# PRの作成・更新時に Claude Opus が自動でコードレビューする
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同じPRに連続でpushされたら、古いレビューは止めて最新だけ走らせる
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 下書きPRと、リポジトリの持ち主以外が作ったPRはレビューしない
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            リポジトリ: ${{ github.repository }}
            PR番号: ${{ github.event.pull_request.number }}
            イベント: ${{ github.event.action }}

            あなたはこのPRのレビュー担当です。実装は別のAIが書いています。
            遠慮せず、マージ前に直すべき点を具体的に指摘してください。

            ## 手順
            1. `gh pr view ${{ github.event.pull_request.number }} --comments` で、PRの説明と既存のコメントを読む。
            2. `gh pr diff ${{ github.event.pull_request.number }}` で差分を読む。必要なら周辺のコードも読む。
            3. イベントが synchronize の場合は、前回のレビュー以降に変わった部分を中心に見る。
               前回指摘した点が直っているかも確認する。同じ指摘を繰り返さない。
            4. 特定の行に対する指摘は、インラインコメントで書く。
            5. 最後に `gh pr comment` で、全体のまとめを1件だけ投稿する。

            ## 見る観点
            - 正しさ：仕様どおりに動くか、境界値や異常系で壊れないか
            - セキュリティ：秘密情報の混入、入力の検証漏れ、危険なコマンド実行
            - 保守性：重複、不要な複雑さ、命名
            - テスト：変更に対してテストが足りているか
            - リポジトリに CLAUDE.md があれば、そこに書かれた規約

            ## 書き方
            - 日本語の「です・ます」で書く。1文は短く切る。
            - 各指摘の先頭に重要度を付ける。
              【必須】マージ前に修正が必要
              【推奨】直したほうがよいが、別対応でも可
              【軽微】表現や整理レベル
            - 各指摘は「問題点」「影響」「修正案」の順で書く。1項目に1つの話題だけ書く。
            - まとめコメントの先頭に、マージしてよいかの判断を1行で書く。
              例：「判断：【必須】が2件あるため、修正後に再レビューが必要です。」
            - 問題がなければ、無理に指摘を作らず「指摘なし」と書く。

            ## 結果の返し方
            - 最後に、このPRに残っている【必須】の指摘の件数を must_fix として返す。
            - 前回までに指摘して、すでに直っているものは数えない。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --json-schema '{"type":"object","properties":{"must_fix":{"type":"integer","minimum":0}},"required":["must_fix"]}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"

      # 【必須】が残っていたら失敗させる。結果が取れなかったときも失敗にする。
      - name: 【必須】の指摘が残っていないか確認
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          must_fix="$(printf '%s' "$RESULT" | jq -r '.must_fix // empty' 2>/dev/null || true)"
          if [[ -z "$must_fix" ]]; then
            echo "レビュー結果を取得できませんでした。"
            exit 1
          fi
          if (( must_fix > 0 )); then
            echo "【必須】の指摘が ${must_fix} 件残っています。"
            exit 1
          fi
          echo "【必須】の指摘はありません。"
