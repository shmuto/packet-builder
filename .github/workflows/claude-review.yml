# .github/workflows/claude-review.yml
# PRの作成・更新時に Claude Opus が自動でコードレビューする
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同じPRに連続でpushされたら、古いレビューは止めて最新だけ走らせる
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 下書きPRと、リポジトリの持ち主以外が作ったPRはレビューしない
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        id: review
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            リポジトリ: ${{ github.repository }}
            PR番号: ${{ github.event.pull_request.number }}
            イベント: ${{ github.event.action }}

            あなたはこのPRのレビュー担当です。
            遠慮せず、マージ前に直すべき点を具体的に指摘してください。

            ## 手順
            1. `gh pr view ${{ github.event.pull_request.number }} --comments` で、PRの説明と既存のコメントを読む。
            2. PRの説明から対応する Issue の番号を探し、`gh issue view <番号>` で成果物と受け入れ条件を読む。
               Issue が見つからないときは、まとめにその旨を書く。
            3. `gh pr diff ${{ github.event.pull_request.number }}` で差分を読む。必要なら周辺のコードも読む。
            4. イベントが synchronize の場合は、前回のレビュー以降に変わった部分を中心に見る。
               前回指摘した点が直っているかも確認する。同じ指摘を繰り返さない。
            5. 特定の行に対する指摘は、インラインコメントで書く。
            6. 最後に `gh pr comment` で、全体のまとめを1件だけ投稿する。

            ## できないこと
            - コードやテスト、`npm` は実行できません。型チェック・テスト・ビルドは CI が別に実行します。
            - ウェブや外部の文書は読めません。RFC や IEEE の本文も参照できません。
            - 実行していないことを「実行した」「試した」「手元で確認した」と書かない。
            - 読んでいない文書を「本文で確かめた」と書かない。
            - 確認はコードを読んで行う。チェックサムなどを自分で計算して確かめたときは、計算の過程をコメントに書く。
            - RFC や IEEE の節番号・値を記憶から挙げるときは、「（記憶による。要確認）」と添える。

            ## 見る観点
            - Issue との対応：受け入れ条件をすべて満たしているか。Issue を読み違えていないか。
              Issue にない変更が混ざっていないか。
            - 正しさ：仕様どおりに動くか、境界値や異常系で壊れないか
            - テスト：受け入れ条件と境界値に対応するテストがあるか。テストの期待値そのものが正しいか
            - セキュリティ：秘密情報の混入、入力の検証漏れ、危険なコマンド実行
            - 保守性：重複、不要な複雑さ、命名
            - AGENTS.md に書かれた規約

            ## 書き方
            - 日本語の「です・ます」で書く。1文は短く切る。
            - 各指摘の先頭に重要度を付ける。
              【必須】マージ前に修正が必要
              【推奨】直したほうがよいが、別対応でも可
              【軽微】表現や整理レベル
            - 各指摘は「問題点」「影響」「修正案」の順で書く。1項目に1つの話題だけ書く。
            - RFC や IEEE の値と照らし合わせられる指摘には、根拠となる番号と節を添える。
            - まとめコメントの先頭に、マージしてよいかの判断を1行で書く。
              例：「判断：【必須】が2件あるため、修正後に再レビューが必要です。」
            - まとめコメントの末尾に「持ち越し」の見出しを作る。
              【推奨】【軽微】のうち、このPRで直さずに別対応にしてよいものを、1行ずつ列挙する。
              ない場合は「なし」と書く。
            - 問題がなければ、無理に指摘を作らず「指摘なし」と書く。

            ## 結果の返し方
            - 最後に、このPRに残っている【必須】の指摘の件数を must_fix として返す。
            - 前回までに指摘して、すでに直っているものは数えない。
          claude_args: |
            --model claude-opus-5-5
            --max-turns 30
            --json-schema '{"type":"object","properties":{"must_fix":{"type":"integer","minimum":0}},"required":["must_fix"]}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Glob,Grep"

      # 【必須】が残っていたら失敗させる。結果が取れなかったときも失敗にする。
      - name: 【必須】の指摘が残っていないか確認
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          must_fix="$(printf '%s' "$RESULT" | jq -r '.must_fix // empty' 2>/dev/null || true)"
          if [[ -z "$must_fix" ]]; then
            echo "レビュー結果を取得できませんでした。"
            exit 1
          fi
          if (( must_fix > 0 )); then
            echo "【必須】の指摘が ${must_fix} 件残っています。"
            exit 1
          fi
          echo "【必須】の指摘はありません。"
