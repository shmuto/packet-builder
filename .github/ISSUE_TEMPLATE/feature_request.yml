name: Feature request
description: Suggest an improvement to the learning experience or UI
labels: ["enhancement"]
body:
  - type: textarea
    id: learning-goal
    attributes:
      label: Learning goal
      description: What networking concept are you trying to learn or teach, and where does tsumiki fall short today?
      placeholder: "I want learners to see what happens when..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: How could tsumiki help with that learning goal?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Screenshots, examples, or links to related issues.
    validations:
      required: false
